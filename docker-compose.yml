services:
  nbfc-intelligence:
    build: .
    ports:
      - "8000:8000"
    environment:
      NBFC_ML_DATA_ROOT: /app/data/processed
      NBFC_ML_ARTIFACT_ROOT: /app/artifacts/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
