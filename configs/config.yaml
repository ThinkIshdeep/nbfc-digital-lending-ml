project:
  name: nbfc-digital-lending-ml
  version: 1.1.0

periods:
  - FY2017
  - FY2018
  - FY2019
  - FY2020
  - As on Dec 31 2020

features:
  classification_regression:
    - current_disbursement_crore
    - current_loan_count
    - current_average_ticket_rupees
    - period_index
  clustering:
    - digital_disbursement_crore
    - digital_loan_count
    - average_ticket_rupees

training:
  random_state: 42
  n_splits: 5
  classification:
    logistic_regression:
      max_iter: 2000
      class_weight: balanced
    random_forest:
      n_estimators: 500
      min_samples_leaf: 3
      max_features: 0.8
  regression:
    ridge_alpha: 10.0
    random_forest:
      n_estimators: 500
      min_samples_leaf: 2
      max_features: 0.8
    gradient_boosting:
      n_estimators: 200
      max_depth: 2
      learning_rate: 0.03
      loss: huber
  clustering:
    n_clusters: 3
    n_init: 20
  anomaly:
    n_estimators: 300
    target_flags: 6


evaluation:
  primary:
    method: group_kfold
    n_splits: 5
    group_column: nbfc_respondent_id
  secondary:
    method: chronological_holdout
    test_period: "As on Dec 31 2020"
    purpose: final-period generalization check
